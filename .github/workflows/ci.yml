name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Everything a user's install reads, checked before it can reach them.
      - name: JSON, tier graph and agent frontmatter
        run: node scripts/validate.mjs
      - name: Shell syntax
        run: sh -n install.sh
      - name: Script syntax
        run: node --check scripts/models.mjs && node --check scripts/probe.mjs
      - name: Types
        run: npx tsc --noEmit

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
